# Enable wireless split function.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# --- 先ほどエラーになった2行の正しい代替設定 ---
# Zephyrのシステムワークキューのスタックと優先度キューを拡張
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# マウス・ポインティング等の入力処理スレッドのスタックサイズを拡張
CONFIG_ZMK_INPUT_MOUSE_THREAD_STACK_SIZE=2048

# --- 前回お伝えした、通信詰まりに有効なBLE送信バッファ（これは有効です） ---
CONFIG_BT_BUF_ACL_TX_COUNT=7

# マウス入力などのイベントバッファに余裕を持たせる
CONFIG_ZMK_INPUT_PROCESSOR_QUEUE_SIZE=32
# Enable Analog Input
CONFIG_ADC=y
# Enable Analog Input Module
CONFIG_ANALOG_INPUT=y
# Just in case, you don't RTFM
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y