# Enable wireless split function.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# メインのイベントキューのサイズを拡張（デフォルトから倍増）
CONFIG_ZMK_MAIN_THREAD_QUEUE_SIZE=64

# マウス入力などのイベントバッファに余裕を持たせる
CONFIG_ZMK_INPUT_PROCESSOR_QUEUE_SIZE=32
# Enable Analog Input
CONFIG_ADC=y
# Enable Analog Input Module
CONFIG_ANALOG_INPUT=y
# Just in case, you don't RTFM
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y